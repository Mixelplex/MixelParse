<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map — MixelParse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Bundled map geometry — generated by build-map-db.js -->
<script src="map-db.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a24;
  --surface:#22222e;
  --surface2:#2a2a38;
  --surface3:#343448;
  --border:#1e1e2a;
  --border-soft:#2a2a38;
  --text:#e2ddd4;
  --text-dim:#a09c94;
  --text-muted:#565468;
  --gold:#c8a040;
  --live:#4caf72;
  --danger:#c0392b;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:13px;overflow:hidden;user-select:none}

/* ── Window ── */
.win{display:flex;flex-direction:column;height:100vh;border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}

/* ── Titlebar ── */
.titlebar{display:flex;align-items:center;gap:.38rem;padding:0 .6rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;-webkit-app-region:drag;height:36px;min-height:36px}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--border-soft);flex-shrink:0;-webkit-app-region:no-drag}
.tb-dot.live{background:var(--live);box-shadow:0 0 5px var(--live)}
.tb-lbl{font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);-webkit-app-region:drag;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-zone{font-size:.72rem;font-weight:500;color:var(--text-dim);-webkit-app-region:drag;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tb-coords{font-size:.65rem;font-weight:500;color:var(--text-muted);font-variant-numeric:tabular-nums;letter-spacing:.02em;flex-shrink:0;-webkit-app-region:no-drag;min-width:120px;text-align:right}
.tb-hint{font-size:.55rem;color:var(--text-muted);opacity:.45;flex-shrink:0;-webkit-app-region:drag;white-space:nowrap}
.tb-btns{display:flex;gap:.05rem;flex-shrink:0;-webkit-app-region:no-drag}
.tb-btn{background:none;border:none;color:var(--text-muted);font-size:.95rem;cursor:pointer;padding:.08rem .3rem;line-height:1;border-radius:3px;-webkit-app-region:no-drag}
.tb-btn:hover{background:var(--surface3);color:var(--text)}

/* ── Layer tabs ── */
.layer-tabs{display:flex;gap:2px;flex-shrink:0;-webkit-app-region:no-drag}
.layer-tab{font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.18rem .45rem;border:1px solid var(--border-soft);border-radius:5px;background:none;color:var(--text-muted);cursor:pointer;-webkit-app-region:no-drag}
.layer-tab:hover{background:var(--surface2);color:var(--text-dim)}
.layer-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(200,160,64,.08)}

/* ── Canvas area ── */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#mapCanvas{display:block;position:absolute;top:0;left:0}

/* ── No-map overlay ── */
.no-map{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;pointer-events:none}
.no-map-icon{font-size:2rem;opacity:.2}
.no-map-msg{font-size:.75rem;color:var(--text-muted);text-align:center;line-height:1.5;max-width:220px}
.no-map-sub{font-size:.65rem;color:var(--text-muted);opacity:.6;text-align:center;max-width:240px}

/* ── Camp bar ── */
.camp-bar{display:flex;align-items:center;gap:.3rem;padding:.32rem .6rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.camp-bar::-webkit-scrollbar{display:none}
.camp-bar.empty{display:none}
.camp-chip{display:flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:500;padding:.18rem .5rem;border-radius:6px;border:1px solid var(--border-soft);background:var(--surface2);color:var(--text-dim);cursor:pointer;flex-shrink:0;white-space:nowrap}
.camp-chip:hover{background:var(--surface3);color:var(--text)}
.camp-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(200,160,64,.1)}
.camp-chip-x{opacity:.4;font-size:.78rem;line-height:1;padding-left:.1rem}
.camp-chip-x:hover{opacity:1;color:var(--danger)}
.camp-save-btn{display:flex;align-items:center;gap:.25rem;font-size:.68rem;font-weight:600;padding:.18rem .5rem;border-radius:6px;border:1px dashed var(--border-soft);background:none;color:var(--text-muted);cursor:pointer;flex-shrink:0;white-space:nowrap;margin-left:auto}
.camp-save-btn:hover{border-color:var(--gold);color:var(--gold)}
.follow-btn{font-size:.62rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.18rem .42rem;border-radius:6px;border:1px solid var(--border-soft);background:none;color:var(--text-muted);cursor:pointer;flex-shrink:0}
.follow-btn.on{border-color:var(--live);color:var(--live);background:rgba(76,175,114,.1)}
.follow-btn:hover{color:var(--text)}

/* ── Save camp overlay ── */
.save-overlay{position:absolute;inset:0;background:rgba(10,10,16,.55);display:none;align-items:center;justify-content:center;z-index:20}
.save-overlay.show{display:flex}
.save-overlay-box{background:var(--surface2);border:1px solid var(--border-soft);border-radius:10px;padding:.85rem;display:flex;flex-direction:column;gap:.5rem;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.save-overlay-lbl{font-size:.65rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}
.save-overlay input{background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);font-family:inherit;font-size:.8rem;padding:.4rem .55rem;outline:none}
.save-overlay input:focus{border-color:var(--gold)}
.save-overlay-btns{display:flex;gap:.4rem;justify-content:flex-end}
.save-overlay-btns button{font-size:.7rem;font-weight:600;padding:.32rem .65rem;border-radius:6px;border:1px solid var(--border-soft);background:var(--surface3);color:var(--text-dim);cursor:pointer}
.save-overlay-btns button.primary{border-color:var(--gold);color:var(--gold)}
.save-overlay-btns button:hover{color:var(--text)}
/* ── Right-click context menu ── */
.map-ctx-menu{position:absolute;z-index:30;background:rgba(12,10,22,.97);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:none;min-width:148px;box-shadow:0 4px 14px rgba(0,0,0,.7);-webkit-app-region:no-drag}
.map-ctx-item{padding:.42rem .8rem;font-family:'Cinzel',serif;font-size:.71rem;letter-spacing:.04em;color:var(--text);cursor:pointer;display:block;border:none;background:transparent;text-align:left;width:100%;white-space:nowrap}
.map-ctx-item:hover{background:var(--surface2);color:var(--gold-light)}
.map-ctx-sep{border:none;border-top:1px solid var(--border);margin:.1rem 0}
.map-ctx-header{padding:.38rem .8rem .28rem;font-family:'Cinzel',serif;font-size:.64rem;font-weight:700;letter-spacing:.06em;color:var(--gold-light);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.map-ctx-danger:hover{background:rgba(160,40,40,.35);color:#ff9c9c}
/* ── Spawn pin creation dialog ── */
#spawnPinOverlay{position:absolute;inset:0;background:rgba(10,10,16,.55);display:none;align-items:center;justify-content:center;z-index:25;-webkit-app-region:no-drag}
#spawnPinOverlay.show{display:flex}
#spawnPinBox{background:var(--surface2);border:1px solid var(--border-soft);border-radius:10px;padding:.85rem;display:flex;flex-direction:column;gap:.45rem;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#spawnPinBox label{font-size:.6rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:-.2rem}
#spawnPinBox input{background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);font-family:inherit;font-size:.8rem;padding:.38rem .52rem;outline:none}
#spawnPinBox input:focus{border-color:var(--gold)}
.sp-chip{font-size:.62rem;padding:.18rem .5rem;border:1px solid var(--border-soft);border-radius:10px;background:var(--surface);color:var(--text-dim);cursor:pointer;font-family:inherit;white-space:nowrap}
.sp-chip:hover{border-color:var(--gold);color:var(--gold-light)}
</style>
</head>
<body>
<div class="win">

  <!-- ── Titlebar ─────────────────────────────────────────────────────────── -->
  <div class="titlebar">
    <div class="tb-dot" id="tbDot"></div>
    <span class="tb-lbl">Map</span>
    <span class="tb-zone" id="tbZone">No zone</span>
    <div class="layer-tabs" id="layerTabs"></div>
    <span class="tb-coords" id="tbCoords"></span>
    <span class="tb-hint">scroll to zoom · drag to pan · dblclick to reset · <strong>right-click</strong> for options</span>
    <div class="tb-btns">
      <button class="tb-btn" onclick="window.MixelParseApp&&window.MixelParseApp.minimizeMap&&window.MixelParseApp.minimizeMap()" title="Minimize">&#8722;</button>
      <button class="tb-btn" onclick="window.MixelParseApp&&window.MixelParseApp.closeMap&&window.MixelParseApp.closeMap()" title="Close">&#215;</button>
    </div>
  </div>

  <!-- ── Camp bar ─────────────────────────────────────────────────────────── -->
  <div class="camp-bar empty" id="campBar">
    <button class="follow-btn" id="followBtn" onclick="toggleFollow()" title="Auto-center on your character">Follow</button>
    <button class="follow-btn" id="depthBtn" onclick="toggleDepth()" title="Only show geometry near your current Z level (hides other floors)">Depth</button>
    <button class="follow-btn" id="autoBtn" onclick="toggleAutoTimers()" title="Auto-start spawn timers from kill/pet-death attribution. Off = timers only start from map clicks and /note set">Auto</button>
    <div id="campChips" style="display:flex;gap:.3rem;align-items:center"></div>
    <button class="camp-save-btn" onclick="openSaveOverlay()" title="Save current view as a camp">+ Save Camp</button>
  </div>

  <!-- ── Canvas area ───────────────────────────────────────────────────────── -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="mapCanvas"></canvas>
    <!-- Right-click context menu -->
    <div class="map-ctx-menu" id="mapCtxMenu">
      <button class="map-ctx-item" onclick="ctxDoDebugPing()">🔴 Debug Ping</button>
      <hr class="map-ctx-sep">
      <button class="map-ctx-item" onclick="ctxShowSpawnPin()">📍 Add Spawn Pin</button>
    </div>

    <!-- Pin-specific context menu (right-click on a spawn pin) -->
    <div class="map-ctx-menu" id="pinCtxMenu">
      <div class="map-ctx-header" id="pinCtxHeader"></div>
      <hr class="map-ctx-sep">
      <button class="map-ctx-item" onclick="pinCtxKilled()">⚔️ Killed</button>
      <button class="map-ctx-item" onclick="pinCtxCharmed()">🌀 Charmed</button>
      <button class="map-ctx-item" id="pinCtxCancelBtn" onclick="pinCtxCancelTimer()">⏱ Cancel Timer</button>
      <hr class="map-ctx-sep">
      <button class="map-ctx-item map-ctx-danger" onclick="pinCtxRemove()">🗑 Remove Pin</button>
    </div>

    <!-- Spawn pin creation dialog -->
    <div id="spawnPinOverlay" onclick="if(event.target===this)closeSpawnPinDialog()">
      <div id="spawnPinBox">
        <div style="font-size:.7rem;font-weight:700;color:var(--gold-light);font-family:'Cinzel',serif;letter-spacing:.06em">📍 Add Spawn Pin</div>
        <div id="spRecent" style="display:none;flex-wrap:wrap;gap:.28rem"></div>
        <label>Mob Name</label>
        <input id="spMobName" placeholder="e.g. A Frost Giant" autocomplete="off">
        <label>Short ID <span style="opacity:.5;font-size:.55rem">(used for timer tracking)</span></label>
        <input id="spPinId" placeholder="e.g. FG" maxlength="8" autocomplete="off">
        <label>Respawn Timer <span style="opacity:.5;font-size:.55rem">(mm:ss or 0)</span></label>
        <input id="spTimer" placeholder="22:00" autocomplete="off">
        <div class="save-overlay-btns" style="margin-top:.2rem">
          <button onclick="closeSpawnPinDialog()">Cancel</button>
          <button class="primary" onclick="saveSpawnPin()">Save Pin</button>
        </div>
      </div>
    </div>
    <!-- Debug coordinate panel — shown when a ping is placed with a valid /loc -->
    <div id="debugPanel" style="display:none;position:absolute;bottom:10px;left:10px;z-index:20;
         background:rgba(10,8,18,.92);border:1px solid #ff3333;border-radius:4px;
         padding:.55rem .7rem;font-family:monospace;font-size:.72rem;color:#eee;
         max-width:520px;line-height:1.55;-webkit-app-region:no-drag">
      <div style="color:#ff3333;font-weight:700;margin-bottom:.3rem;font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.06em">
        📍 COORDINATE DEBUG
      </div>
      <pre id="debugPanelText" style="margin:0;white-space:pre-wrap;color:#ccc"></pre>
      <button onclick="
        navigator.clipboard.writeText(document.getElementById('debugPanelText').textContent)
          .then(function(){this.textContent='✓ Copied';var b=this;setTimeout(function(){b.textContent='📋 Copy'},1200)})
          .catch(function(){});
      " style="margin-top:.4rem;padding:.2rem .55rem;font-size:.68rem;background:#1a0a0a;
               border:1px solid #ff3333;color:#ff6666;border-radius:3px;cursor:pointer;font-family:monospace">
        📋 Copy
      </button>
      <button onclick="
        document.getElementById('debugPanel').style.display='none';
      " style="margin-top:.4rem;margin-left:.35rem;padding:.2rem .55rem;font-size:.68rem;
               background:transparent;border:1px solid #444;color:#888;border-radius:3px;cursor:pointer">
        ✕
      </button>
    </div>
    <div class="no-map" id="noMap">
      <div class="no-map-icon">&#9760;</div>
      <div class="no-map-msg" id="noMapMsg">Waiting for zone data</div>
      <div class="no-map-sub" id="noMapSub">Start a session and enter a zone</div>
    </div>
    <div class="save-overlay" id="saveOverlay" onclick="if(event.target===this) closeSaveOverlay()">
      <div class="save-overlay-box">
        <div class="save-overlay-lbl">Save Camp</div>
        <input type="text" id="saveOverlayInput" placeholder="e.g. Upper Bear Bits" maxlength="40" />
        <div class="save-overlay-btns">
          <button onclick="closeSaveOverlay()">Cancel</button>
          <button class="primary" onclick="confirmSaveCamp()">Save</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /.win -->

<script>
'use strict';

// ── Supabase Storage — public map bucket ─────────────────────────────────────
var SUPABASE_MAP_URL = 'https://sonenrhxvmheslwufhqf.supabase.co/storage/v1/object/public/map-files';

// ── State ─────────────────────────────────────────────────────────────────────
var _state       = null;  // last session state push
var _playerLoc   = null;  // { x, y, z } — most recent /loc
var _mapData     = null;  // { lines:[], points:[] }
var _transform   = null;  // { scale, ox, oy }

// ── /loc → canvas coordinate mapping (empirically confirmed in Permafrost) ────
// EQ /loc reports: first value = N/S (locX), second value = E/W (locY)
// Correct mapping: mapX = -locY, mapY = -locX  → toCanvas(-locY, -locX)
// Confirmed: /loc(929.81, 183.46) placed at ping ex=-167, ey=-924 → Δ(+16.5, +6.3) ✓
var _loadedZone  = null;  // zone_shortname currently loaded
var _loadedFile  = null;  // filename currently loaded
var _availLayers = [];    // list of .txt filenames for current zone
var _drawPending = false;
// ── Zoom / pan ────────────────────────────────────────────────────────────────
var _zoom  = 1;
var _panX  = 0;
var _panY  = 0;
var _debugPing = null;  // { ex, ey } in map-file coords, set by right-click
var _playerHeading = null; // movement direction in radians (null = not yet known)
var _ctxMenuPos    = null; // { ex, ey, canvasX, canvasY } of last right-click
var _drag  = null;  // { startX, startY, panX0, panY0 } while dragging

// ── Follow mode + camp views ─────────────────────────────────────────────────
var _follow                 = false;  // auto-recenter on player loc updates
var _campViews              = [];     // camp_views for current zone (from state push)
var _activeCampName         = null;   // currently selected camp chip
var _viewInitializedForZone = null;   // zoneShortname we've already auto-positioned for
var FOLLOW_WORLD_RADIUS     = 700;    // game units visible around player in follow mode

var canvas   = document.getElementById('mapCanvas');
var wrap     = document.getElementById('canvasWrap');
var noMap    = document.getElementById('noMap');

// ── Canvas sizing ─────────────────────────────────────────────────────────────
function resizeCanvas() {
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
  if (_mapData && _transform) {
    _transform = buildTransform(_mapData, canvas.width, canvas.height);
    scheduleDraw();
  }
}

var _roTimer = null;
var ro = new ResizeObserver(function() {
  clearTimeout(_roTimer);
  _roTimer = setTimeout(resizeCanvas, 60);
});
ro.observe(wrap);
resizeCanvas();

// ── Zoom / pan interactions ───────────────────────────────────────────────────
canvas.style.cursor = 'grab';

// Scroll to zoom — centered on mouse position
canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  if (!_transform) return;
  if (_follow) { _follow = false; updateFollowBtn(); }
  var delta = e.deltaY > 0 ? 0.85 : 1.18;
  var newZoom = Math.max(0.4, Math.min(12, _zoom * delta));
  // Keep the point under the mouse fixed
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;
  _panX = mx - (mx - _panX) * (newZoom / _zoom);
  _panY = my - (my - _panY) * (newZoom / _zoom);
  _zoom = newZoom;
  scheduleDraw();
}, { passive: false });

// Drag to pan
canvas.addEventListener('mousedown', function(e) {
  if (_follow) { _follow = false; updateFollowBtn(); }
  _drag = { startX: e.clientX, startY: e.clientY, panX0: _panX, panY0: _panY };
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('mousemove', function(e) {
  if (!_drag) return;
  _panX = _drag.panX0 + (e.clientX - _drag.startX);
  _panY = _drag.panY0 + (e.clientY - _drag.startY);
  scheduleDraw();
});
canvas.addEventListener('mouseup',    function() { _drag = null; canvas.style.cursor = 'grab'; });
canvas.addEventListener('mouseleave', function() { _drag = null; canvas.style.cursor = 'grab'; });

// Double-click to reset view
canvas.addEventListener('dblclick', function() {
  _follow = false; _activeCampName = null;
  updateFollowBtn(); renderCampBar();
  _zoom = 1; _panX = 0; _panY = 0;
  scheduleDraw();
});

// ── Right-click context menu ──────────────────────────────────────────────────
canvas.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  if (!_transform) return;
  var rect = canvas.getBoundingClientRect();
  var cx = (e.clientX - rect.left) * (canvas.width  / rect.width);
  var cy = (e.clientY - rect.top)  * (canvas.height / rect.height);
  var cx2 = canvas.width  / 2;
  var cy2 = canvas.height / 2;
  var bx = (cx - cx2 - _panX) / _zoom + cx2;
  var by = (cy - cy2 - _panY) / _zoom + cy2;
  var ex = (bx - _transform.ox) / _transform.scale;
  var ey = (by - _transform.oy) / _transform.scale;
  _ctxMenuPos = { ex: ex, ey: ey, canvasX: e.clientX, canvasY: e.clientY };

  // Pin hit-test: right-click within ~14 CSS px of a spawn pin opens the pin
  // menu instead. locToCanvas() output is in canvas backing pixels (zoom/pan
  // already applied), same space as (cx, cy).
  var hitPin = null, hitDist = Infinity;
  var hitR = 14 * (canvas.width / rect.width);   // 14 CSS px → backing px
  var pins = (_state && _state.spawnPins) || [];
  for (var i = 0; i < pins.length; i++) {
    var pp = locToCanvas(pins[i].x, pins[i].y);
    var pdx = pp.cx - cx, pdy = pp.cy - cy;
    var d = Math.sqrt(pdx*pdx + pdy*pdy);
    if (d < hitR && d < hitDist) { hitPin = pins[i]; hitDist = d; }
  }
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (hitPin) { openPinCtxMenu(hitPin, mx, my); return; }

  closeCtxMenu();
  var menu = document.getElementById('mapCtxMenu');
  menu.style.left = mx + 'px';
  menu.style.top  = my + 'px';
  menu.style.display = 'block';
});

// ── Pin context menu ──────────────────────────────────────────────────────────
var _ctxPin = null;   // pin object the open pin menu refers to

function _pinHasActiveTimer(pinLabel) {
  // Pushed timer payload carries triggered_at (ms) + timer_sec only —
  // cancelled timers are filtered out before push, expiry is computed.
  var timers = (_state && _state.spawnTimers) || [];
  var now = Date.now();
  for (var i = 0; i < timers.length; i++) {
    var t = timers[i];
    if (t.pin_label === pinLabel && now < t.triggered_at + t.timer_sec * 1000) return true;
  }
  return false;
}

function openPinCtxMenu(pin, mx, my) {
  closeCtxMenu();
  _ctxPin = pin;
  var hdr = document.getElementById('pinCtxHeader');
  hdr.textContent = pin.pin_label + (pin.display_name ? ' · ' + pin.display_name : '');
  document.getElementById('pinCtxCancelBtn').style.display =
    _pinHasActiveTimer(pin.pin_label) ? 'block' : 'none';
  var menu = document.getElementById('pinCtxMenu');
  menu.style.left = mx + 'px';
  menu.style.top  = my + 'px';
  menu.style.display = 'block';
}

function _sendPinCmd(type) {
  if (!_ctxPin) return;
  if (window.MixelParseApp && window.MixelParseApp.sendMapCommand) {
    window.MixelParseApp.sendMapCommand({ type: type, pinLabel: _ctxPin.pin_label });
    console.log('[MAP] ' + type + ' sent for pin', _ctxPin.pin_label);
  }
}

function pinCtxKilled()      { _sendPinCmd('pinKilled');   closeCtxMenu(); }
function pinCtxCharmed()     { _sendPinCmd('pinCharmed');  closeCtxMenu(); }
function pinCtxCancelTimer() { _sendPinCmd('cancelTimer'); closeCtxMenu(); }
function pinCtxRemove() {
  if (!_ctxPin) { closeCtxMenu(); return; }
  var name = _ctxPin.pin_label + (_ctxPin.display_name ? ' (' + _ctxPin.display_name + ')' : '');
  if (confirm('Remove pin ' + name + '? Its timers will be cancelled.')) {
    _sendPinCmd('deleteSpawnPin');
  }
  closeCtxMenu();
}

// Close context menu on any outside click
document.addEventListener('click', function() { closeCtxMenu(); });
document.addEventListener('keydown', function(e) {

});

function closeCtxMenu() {
  document.getElementById('mapCtxMenu').style.display = 'none';
  var pm = document.getElementById('pinCtxMenu');
  if (pm) { pm.style.display = 'none'; }
  _ctxPin = null;
}

function ctxDoDebugPing() {
  closeCtxMenu();
  if (!_ctxMenuPos) return;
  // Clear if near existing ping
  if (_debugPing) {
    var pp = toCanvas(_debugPing.ex, _debugPing.ey);
    var dx = _ctxMenuPos.canvasX - canvas.getBoundingClientRect().left - pp.cx;
    var dy = _ctxMenuPos.canvasY - canvas.getBoundingClientRect().top  - pp.cy;
    if (Math.sqrt(dx*dx+dy*dy) < 24) { _debugPing=null; scheduleDraw(); return; }
  }
  _debugPing = { ex: _ctxMenuPos.ex, ey: _ctxMenuPos.ey };
  _updateDebugPanel();
  scheduleDraw();
}

function ctxShowSpawnPin() {
  closeCtxMenu();
  if (!_ctxMenuPos) return;
  document.getElementById('spMobName').value = '';
  document.getElementById('spPinId').value = '';
  document.getElementById('spPinId').dataset.edited = '';
  document.getElementById('spTimer').value = '';
  renderRecentMobs();
  document.getElementById('spawnPinOverlay').classList.add('show');
  document.getElementById('spMobName').focus();
}

// ── Recently used mobs (localStorage, per zone with global fallback) ──────────
function _recentKey() { return 'mixelparse_recent_mobs'; }
function loadRecentMobs() {
  try { return JSON.parse(localStorage.getItem(_recentKey()) || '[]'); }
  catch(e) { return []; }
}
function pushRecentMob(entry) {
  var list = loadRecentMobs();
  // De-dupe by mob name (case-insensitive), most recent first
  list = list.filter(function(r){ return r.name.toLowerCase() !== entry.name.toLowerCase(); });
  list.unshift(entry);
  if (list.length > 10) list = list.slice(0, 10);
  try { localStorage.setItem(_recentKey(), JSON.stringify(list)); } catch(e) {}
}
function renderRecentMobs() {
  var wrap = document.getElementById('spRecent');
  var list = loadRecentMobs();
  // Prefer recents from the current zone, then everything else
  if (_loadedZone) {
    list = list.filter(function(r){ return r.zone === _loadedZone; })
      .concat(list.filter(function(r){ return r.zone !== _loadedZone; }));
  }
  if (!list.length) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.innerHTML = '';
  list.slice(0, 6).forEach(function(r) {
    var b = document.createElement('button');
    b.className = 'sp-chip';
    b.type = 'button';
    b.textContent = r.name + (r.timer ? ' · ' + r.timer : '');
    b.addEventListener('click', function() {
      document.getElementById('spMobName').value = r.name;
      document.getElementById('spPinId').value   = r.pinId || _autoLabel(r.name);
      document.getElementById('spPinId').dataset.edited = '1';
      document.getElementById('spTimer').value   = r.timer || '';
    });
    wrap.appendChild(b);
  });
  wrap.style.display = 'flex';
}

// Auto-generate a short pin label from mob name
function _autoLabel(name) {
  var words = name.trim().replace(/^(a|an|the)\s+/i,'').split(/\s+/).filter(Boolean);
  var label = words.map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,4);
  return label || 'PIN';
}

function closeSpawnPinDialog() {
  document.getElementById('spawnPinOverlay').classList.remove('show');
}

function parseTimerSec(str) {
  str = (str||'').trim();
  if (!str || str === '0') return 0;
  var parts = str.split(':');
  if (parts.length === 2) return Math.max(0, parseInt(parts[0]||0,10)*60 + parseInt(parts[1]||0,10));
  return Math.max(0, parseInt(str,10));
}

// Find a pin label not already in use on the map (FG → FG2 → FG3 ...)
// The Supabase upsert conflicts on (user, zone, pin_label), so a duplicate
// label silently MOVES the existing pin instead of creating a new one.
function _uniquePinLabel(base) {
  base = base.toUpperCase();
  var used = {};
  ((_state && _state.spawnPins) || []).forEach(function(p){ used[(p.pin_label||'').toUpperCase()] = 1; });
  if (!used[base]) return base;
  for (var n = 2; n < 100; n++) {
    // Keep total length ≤ 8 (matches input maxlength and /note set format)
    var suffix = String(n);
    var candidate = base.slice(0, 8 - suffix.length) + suffix;
    if (!used[candidate]) return candidate;
  }
  return base + '_' + Date.now() % 1000;  // pathological fallback
}

function saveSpawnPin() {
  if (!_ctxMenuPos || !_loadedZone) { closeSpawnPinDialog(); return; }
  var mobName  = document.getElementById('spMobName').value.trim();
  var pinId    = document.getElementById('spPinId').value.trim() || _autoLabel(mobName);
  var timerRaw = document.getElementById('spTimer').value.trim();
  var timerSec = parseTimerSec(timerRaw);
  if (!mobName) { document.getElementById('spMobName').focus(); return; }
  // Remember for the recents list (store the BASE id — suffixing happens per placement)
  pushRecentMob({ name: mobName, pinId: pinId.toUpperCase(), timer: timerRaw, zone: _loadedZone });
  var finalLabel = _uniquePinLabel(pinId);
  // Inverse transform: mapX=-locY → locY=-ex; mapY=-locX → locX=-ey
  var locX = -_ctxMenuPos.ey;
  var locY = -_ctxMenuPos.ex;
  var locZ = _playerLoc ? _playerLoc.z : 0;
  window.MixelParseApp.sendMapCommand({
    type: 'createSpawnPin',
    zone: _loadedZone,
    pinLabel: finalLabel,
    displayName: mobName,
    x: locX, y: locY, z: locZ,
    timerSec: timerSec,
  });
  console.log('[MAP] createSpawnPin sent', { zone: _loadedZone, pinLabel: finalLabel, x: locX, y: locY });
  closeSpawnPinDialog();
}

// Auto-fill pin ID when mob name is typed
document.getElementById('spMobName').addEventListener('input', function() {

  if (!idField.dataset.edited) idField.value = _autoLabel(this.value);
});
document.getElementById('spPinId').addEventListener('input', function() {

document.getElementById('spawnPinOverlay').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveSpawnPin();
});

// ── Map file parsing ──────────────────────────────────────────────────────────
function parseMap(content) {
  var lines = [], points = [];
  var raw = content.split('\n');
  for (var i = 0; i < raw.length; i++) {
    var line = raw[i].trim();
    if (line.charAt(0) === 'L' && line.charAt(1) === ' ') {
      var parts = line.slice(2).split(',');
      if (parts.length >= 9) {
        var v = parts.map(function(s){ return parseFloat(s); });
        if (!isNaN(v[0])) {
          lines.push({ x1:v[0],y1:v[1],z1:v[2], x2:v[3],y2:v[4],z2:v[5], r:v[6],g:v[7],b:v[8] });
        }
      }
    } else if (line.charAt(0) === 'P' && line.charAt(1) === ' ') {
      var parts2 = line.slice(2).split(',');
      if (parts2.length >= 8) {
        var nums = parts2.slice(0,7).map(function(s){ return parseFloat(s); });
        var label = parts2.slice(7).join(',').trim();
        if (!isNaN(nums[0]) && label) {
          points.push({ x:nums[0],y:nums[1],z:nums[2], r:nums[3],g:nums[4],b:nums[5], size:nums[6], label:label });
        }
      }
    }
  }
  return { lines:lines, points:points };
}

// ── Coordinate transform ──────────────────────────────────────────────────────
// EQ coords: X east/west, Y north/south (north = +Y)
// Canvas: origin top-left, Y increases downward
// Transform: canvasX = eqX * scale + ox
//            canvasY = -eqY * scale + oy   (flip Y so north = top)
function buildTransform(md, cw, ch) {
  if (!md || !md.lines.length) return null;
  var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (var i=0; i<md.lines.length; i++) {
    var s=md.lines[i];
    if (s.x1<minX) minX=s.x1; if (s.x1>maxX) maxX=s.x1;
    if (s.x2<minX) minX=s.x2; if (s.x2>maxX) maxX=s.x2;
    if (s.y1<minY) minY=s.y1; if (s.y1>maxY) maxY=s.y1;
    if (s.y2<minY) minY=s.y2; if (s.y2>maxY) maxY=s.y2;
  }
  var PAD = 38;
  var mapW = maxX-minX || 1, mapH = maxY-minY || 1;
  var scale = Math.min((cw-2*PAD)/mapW, (ch-2*PAD)/mapH);
  var scaledW = mapW*scale, scaledH = mapH*scale;
  // Center the map
  // EQ map file coordinate system: Y increases going south (positive = south = canvas-down)
  // No Y-flip needed — EQ map Y already matches canvas Y direction
  var ox = -minX*scale + PAD + (cw-2*PAD-scaledW)/2;
  var oy = -minY*scale + PAD + (ch-2*PAD-scaledH)/2;
  return { scale:scale, ox:ox, oy:oy };
}

// Map-file coords → canvas. Do NOT pass raw /loc values here — use locToCanvas().
function toCanvas(ex, ey) {
  if (!_transform) return { cx:0, cy:0 };
  var bx = ex * _transform.scale + _transform.ox;
  var by = ey * _transform.scale + _transform.oy;   // no Y-flip
  var cx2 = canvas.width  / 2;
  var cy2 = canvas.height / 2;
  return {
    cx: (bx - cx2) * _zoom + cx2 + _panX,
    cy: (by - cy2) * _zoom + cy2 + _panY
  };
}

// /loc → canvas coord: mapX = -locY (negate E/W), mapY = -locX (negate N/S)
function locToCanvas(locX, locY) {
  return toCanvas(-locY, -locX);
}

// Pan/zoom so map-file coords (ex,ey) sit at canvas center
function centerOn(ex, ey, zoom) {
  if (!_transform) return;
  if (zoom != null) _zoom = zoom;
  var bx = ex * _transform.scale + _transform.ox;
  var by = ey * _transform.scale + _transform.oy;   // no Y-flip
  var cx2 = canvas.width  / 2;
  var cy2 = canvas.height / 2;
  _panX = -(bx - cx2) * _zoom;
  _panY = -(by - cy2) * _zoom;
  scheduleDraw();
}

// Like centerOn but takes /loc-style coords — same mapping as locToCanvas
function centerOnLoc(locX, locY, zoom) {
  centerOn(-locY, -locX, zoom);
}

// Returns map-file coords at canvas center
function getViewCenterEQ() {
  if (!_transform) return null;
  var cx2 = canvas.width  / 2;
  var cy2 = canvas.height / 2;
  var bx = cx2 - _panX / _zoom;
  var by = cy2 - _panY / _zoom;
  return {
    x: (bx - _transform.ox) / _transform.scale,
    y: (by - _transform.oy) / _transform.scale   // no Y-flip
  };
}

// Zoom level needed so a circle of worldRadius game units fills the canvas
function zoomForWorldRadius(worldRadius) {
  if (!_transform) return 3;
  var halfPx = Math.min(canvas.width, canvas.height) / 2 - 30;
  return Math.max(0.4, Math.min(14, halfPx / (worldRadius * _transform.scale)));
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function scheduleDraw() {
  if (_drawPending) return;
  _drawPending = true;
  requestAnimationFrame(function() { _drawPending=false; drawMap(); });
}

function drawMap() {
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!_mapData || !_transform) return;

  var lw = Math.max(0.5, Math.min(2.5, _zoom * 0.9));

  // ── Lines ──
  // Depth filter: reference Z from player /loc (only active when we have one)
  var zRef = (_depthFilter && _playerLoc) ? _playerLoc.z : null;

  for (var i=0; i<_mapData.lines.length; i++) {
    var s=_mapData.lines[i];
    if (zRef !== null) {
      // Distance from player Z to the line's Z range — skip if beyond the floor band
      var zlo = Math.min(s.z1, s.z2), zhi = Math.max(s.z1, s.z2);
      var dzf = zRef < zlo ? zlo - zRef : (zRef > zhi ? zRef - zhi : 0);
      if (dzf > DEPTH_RANGE) continue;
    }
    var p1=toCanvas(s.x1,s.y1), p2=toCanvas(s.x2,s.y2);
    ctx.strokeStyle='rgba('+s.r+','+s.g+','+s.b+',0.55)';
    ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(p1.cx,p1.cy); ctx.lineTo(p2.cx,p2.cy); ctx.stroke();
  }

  // ── Point labels (named, size >= 2, only draw text at zoom >= 1) ──
  for (var j=0; j<_mapData.points.length; j++) {
    var pt=_mapData.points[j];
    if (!pt.label || pt.size < 2) continue;
    if (zRef !== null && Math.abs(pt.z - zRef) > DEPTH_RANGE) continue;
    var pp=toCanvas(pt.x,pt.y);
    ctx.fillStyle='rgba('+pt.r+','+pt.g+','+pt.b+',0.7)';
    ctx.beginPath(); ctx.arc(pp.cx,pp.cy,Math.max(1.5,2*_zoom),0,Math.PI*2); ctx.fill();
    if (pt.size >= 3 && _zoom >= 0.8) {
      ctx.font= Math.round(8*_zoom)+'px Inter,sans-serif';
      ctx.fillStyle='rgba('+pt.r+','+pt.g+','+pt.b+',0.65)';
      ctx.fillText(pt.label.replace(/_/g,' '), pp.cx+4*_zoom, pp.cy+3*_zoom);
    }
  }

  // ── Spawn pins ──
  drawSpawnPins(ctx);

  // ── Player dot ──
  if (_playerLoc) {
    var pd=locToCanvas(_playerLoc.x, _playerLoc.y);   // /loc: first=N/S, second=E/W
    drawPlayerDot(ctx,pd.cx,pd.cy);
  }

  // ── Debug ping (right-click ground-truth marker) ──────────────────────────
  if (_debugPing) {
    var pp2 = toCanvas(_debugPing.ex, _debugPing.ey);
    var r   = Math.max(8, 10 * _zoom);
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth   = Math.max(1.5, 2 * _zoom);
    // Circle
    ctx.beginPath(); ctx.arc(pp2.cx, pp2.cy, r, 0, Math.PI*2); ctx.stroke();
    // Crosshair
    ctx.beginPath();
    ctx.moveTo(pp2.cx - r*1.6, pp2.cy); ctx.lineTo(pp2.cx + r*1.6, pp2.cy);
    ctx.moveTo(pp2.cx, pp2.cy - r*1.6); ctx.lineTo(pp2.cx, pp2.cy + r*1.6);
    ctx.stroke();
    // Coord label
    ctx.fillStyle = '#ff3333';
    ctx.font = Math.max(10, 11 * Math.min(_zoom, 1.5)) + 'px monospace';
    ctx.fillText('ping ' + _debugPing.ex.toFixed(0) + ', ' + _debugPing.ey.toFixed(0),
                 pp2.cx + r + 4, pp2.cy - 3);
    // Update titlebar with ping coords and delta vs player dot
    var tbEl = document.getElementById('tbCoords');
    if (tbEl) {
      var pingStr = 'ping(' + _debugPing.ex.toFixed(0) + ',' + _debugPing.ey.toFixed(0) + ')';
      if (_playerLoc) {
        var dotEx = -_playerLoc.y;
        var dotEy = -_playerLoc.x;
        var dx = (_debugPing.ex - dotEx).toFixed(0);
        var dy = (_debugPing.ey - dotEy).toFixed(0);
        tbEl.textContent = _playerLoc.x.toFixed(0)+', '+_playerLoc.y.toFixed(0)+', '+_playerLoc.z.toFixed(0)
          + '  |  ' + pingStr + '  Δ(' + dx + ', ' + dy + ')';
      } else {
        tbEl.textContent = pingStr;
      }
    }
  }
}

function drawSpawnPins(ctx) {
  if (!_state) return;
  var pins   = _state.spawnPins   || [];
  var timers = _state.spawnTimers || [];
  if (!pins.length || !_transform) return;

  var now = Date.now();
  var timerMap = {};
  for (var i=0; i<timers.length; i++) timerMap[timers[i].pin_label] = timers[i];

  // Charm attribution: solid halo = active pet's home pin; dashed = pending
  // "next charm" pre-mark (persists until consumed or cleared)
  var charmPin = (_state.activeCharm && _state.activeCharm.spawnPin) || null;
  var overridePin = null;
  if (!charmPin && _state.charmPinOverride) {
    overridePin = _state.charmPinOverride.pinLabel;
  }

  for (var j=0; j<pins.length; j++) {
    var pin = pins[j];
    var p   = locToCanvas(pin.x, pin.y);   // pin.x=N/S, pin.y=E/W → swap to map coords
    var t   = timerMap[pin.pin_label];

    // Charm halo (under the ring/marker)
    var isCharmPin    = charmPin    === pin.pin_label;
    var isOverridePin = overridePin === pin.pin_label;
    if (isCharmPin || isOverridePin) {
      ctx.save();
      ctx.fillStyle   = '#38b6ff';
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.arc(p.cx, p.cy, 13, 0, 2 * Math.PI);
      ctx.fill();
      ctx.restore();
      // Attribution label above the pin
      ctx.save();
      ctx.font      = 'bold 9px Inter,sans-serif';
      ctx.fillStyle = '#38b6ff';
      ctx.textAlign = 'center';
      ctx.fillText('🌀 charmed', p.cx, p.cy - 17);
      ctx.restore();
    }

    var color, ringPct=-1, ready=false;
    if (!t) {
      color = '#3a3a52';
    } else {
      var elapsed  = now - t.triggered_at;
      var total    = t.timer_sec * 1000;
      var remaining= Math.max(0, total - elapsed);
      ringPct = Math.min(1, elapsed / total);
      if (remaining === 0) {
        color = '#4caf72'; ready = true;
      } else if (remaining < 120000) {
        color = '#c0392b';
      } else {
        color = '#c8a040';
      }
    }

    // Ring arc (progress = elapsed fraction)
    if (ringPct >= 0) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth   = 2.5;
      ctx.globalAlpha = ready ? 0.9 : 0.65;
      ctx.beginPath();
      ctx.arc(p.cx, p.cy, 9, -Math.PI/2, -Math.PI/2 + ringPct*2*Math.PI);
      ctx.stroke();
      ctx.restore();
      // Dim track
      ctx.save();
      ctx.strokeStyle = 'rgba(80,80,100,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.cx, p.cy, 9, -Math.PI/2 + ringPct*2*Math.PI, -Math.PI/2 + 2*Math.PI);
      ctx.stroke();
      ctx.restore();
    }

    // Diamond marker
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = t ? 1 : 0.4;
    ctx.beginPath();
    ctx.moveTo(p.cx,       p.cy - 5);
    ctx.lineTo(p.cx + 4.5, p.cy);
    ctx.lineTo(p.cx,       p.cy + 5);
    ctx.lineTo(p.cx - 4.5, p.cy);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Label
    var label = pin.display_name || pin.pin_label;
    ctx.save();
    ctx.font      = 'bold 9px Inter,sans-serif';
    ctx.fillStyle = t ? color : 'rgba(86,84,104,0.7)';
    ctx.fillText(label, p.cx + 8, p.cy + 4);
    ctx.restore();

    // Digital countdown readout (to the second) under the label
    if (t) {
      var remMs  = Math.max(0, t.timer_sec * 1000 - (now - t.triggered_at));
      var txt;
      if (remMs === 0) {
        txt = 'UP';
      } else {
        var totSec = Math.ceil(remMs / 1000);
        var hh = Math.floor(totSec / 3600);
        var mm2 = Math.floor((totSec % 3600) / 60);
        var ss2 = totSec % 60;
        txt = (hh > 0 ? hh + ':' + String(mm2).padStart(2,'0') : String(mm2))
              + ':' + String(ss2).padStart(2,'0');
      }
      ctx.save();
      ctx.font      = 'bold 10px "Roboto Mono","Courier New",monospace';
      ctx.fillStyle = color;
      ctx.globalAlpha = ready ? 1 : 0.95;
      ctx.fillText(txt, p.cx + 8, p.cy + 15);
      ctx.restore();
    }
  }
}

function drawPlayerDot(ctx, cx, cy) {
  // Heading indicator — drawn first so dot sits on top
  if (_playerHeading !== null) {
    var arrowR = Math.max(5, 6 * Math.min(_zoom, 2));
    var tipDist = 14 + arrowR;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(_playerHeading);
    ctx.fillStyle = 'rgba(255, 210, 60, 0.92)';
    ctx.beginPath();
    ctx.moveTo(tipDist, 0);          // tip of arrow
    ctx.lineTo(tipDist - arrowR*1.4, -arrowR * 0.65);
    ctx.lineTo(tipDist - arrowR*1.4,  arrowR * 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // Glow
  var g = ctx.createRadialGradient(cx,cy,0, cx,cy,12);
  g.addColorStop(0, 'rgba(76,175,114,0.55)');
  g.addColorStop(1, 'rgba(76,175,114,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx,cy,12,0,Math.PI*2); ctx.fill();
  // Dot
  ctx.fillStyle = '#4caf72';
  ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
  // Core
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx,cy,1.8,0,Math.PI*2); ctx.fill();
}

// ── Layer handling ────────────────────────────────────────────────────────────
function renderLayerTabs() {
  var el = document.getElementById('layerTabs');
  if (!el) return;
  // Only show layer tabs when there are 2+ genuinely content-filled layers.
  // Most zones have empty _1/_2/_3 stubs — hide tabs to avoid clutter.
  // The camp bar handles named navigation instead.
  if (_availLayers.length <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = _availLayers.map(function(f) {
    var active = f === _loadedFile;
    var lbl = f.replace(/\.txt$/i, '').replace(/.*_/, '') || '0';
    if (lbl === _loadedZone) lbl = '0';
    return '<button class="layer-tab' + (active ? ' active' : '') + '" onclick="loadLayer(\'' + f + '\')" title="Map layer">' + lbl + '</button>';
  }).join('');
}

// Apply parsed map content — shared by both Supabase and local paths
function applyMapContent(content, filename) {
  _mapData    = parseMap(content);
  _transform  = buildTransform(_mapData, canvas.width, canvas.height);
  _loadedFile = filename;
  // Reset view on new map — pickInitialView() (called from onState) will
  // immediately override this with a camp/follow position if available
  _zoom = 1; _panX = 0; _panY = 0;
  _follow = false; _activeCampName = null;
  noMap.style.display = 'none';
  renderLayerTabs();
  renderCampBar();
  scheduleDraw();
}

// Fetch one file from Supabase Storage; returns text or null
async function fetchRemote(filename) {
  try {
    var r = await fetch(SUPABASE_MAP_URL + '/' + filename.toLowerCase());
    if (!r.ok) return null;
    var text = await r.text();
    return (text && text.length > 20) ? text : null;
  } catch(e) { return null; }
}

// Look up a file in the bundled MAP_DB
function getFromDB(filename) {
  if (!window.MAP_DB) return null;
  var key = filename.replace(/\.txt$/i, '').toLowerCase();
  return window.MAP_DB[key] || null;
}

// Load a single layer — MAP_DB → Supabase → local IPC
async function loadLayer(filename) {
  // 1 — Bundled MAP_DB (instant, no network)
  var dbContent = getFromDB(filename);
  if (dbContent) { applyMapContent(dbContent, filename); return; }

  setNoMap('Loading ' + filename + '…', '');

  // 2 — Supabase Storage (for zones added after build)
  var content = await fetchRemote(filename);
  if (content) { applyMapContent(content, filename); return; }

  // 3 — Local IPC fallback
  if (window.MixelParseApp && window.MixelParseApp.readMapFile) {
    var result = await window.MixelParseApp.readMapFile(filename);
    if (result && result.content) { applyMapContent(result.content, filename); return; }
    setNoMap('Failed to load ' + filename, result ? (result.error || '') : '');
    return;
  }

  setNoMap('Cannot load ' + filename, 'Zone not in bundled DB and no network/local source');
}

// Load all layers for a zone — MAP_DB → Supabase → local IPC
async function loadZone(shortname) {
  if (!shortname) return;
  var lower = String(shortname).trim().toLowerCase();
  var suffixes = ['', '_1', '_2', '_3'];

  // ── 1. Check bundled MAP_DB ──────────────────────────────────────────────────
  if (window.MAP_DB) {
    var dbKeys = suffixes
      .map(function(s){ return lower + s; })
      .filter(function(k){
        // Only include layers with real content (>1 KB) — filters out EQ client stubs
        return window.MAP_DB[k] && window.MAP_DB[k].length > 1024;
      });

    if (!dbKeys.length) {
      // Diagnostic: show the exact string (whitespace/casing issues are invisible in UI)
      var similar = Object.keys(window.MAP_DB).filter(function(k){ return k.indexOf(lower.slice(0,5)) >= 0; }).slice(0,5);
      console.warn('[MAP] MAP_DB miss for key', JSON.stringify(lower),
                   '(raw:', JSON.stringify(shortname) + ')',
                   'similar keys:', similar);
    }

    if (dbKeys.length) {
      _loadedZone  = shortname;
      _availLayers = dbKeys.map(function(k){ return k + '.txt'; });
      renderLayerTabs();
      var baseKey = window.MAP_DB[lower] ? lower : dbKeys[0];
      applyMapContent(window.MAP_DB[baseKey], baseKey + '.txt');
      return;
    }
  }

  setNoMap('Loading ' + shortname + '…', '');

  // ── 2. Try Supabase Storage (parallel fetch) ─────────────────────────────────
  var candidates = suffixes.map(function(s){ return lower + s + '.txt'; });
  var fetched = await Promise.all(candidates.map(async function(name) {
    var text = await fetchRemote(name);
    return text ? { name: name, content: text } : null;
  }));
  var remote = fetched.filter(Boolean);

  if (remote.length) {
    _loadedZone  = shortname;
    _availLayers = remote.map(function(r){ return r.name; });
    renderLayerTabs();
    applyMapContent(remote[0].content, remote[0].name);
    return;
  }

  // ── 3. Fall back to local maps folder via IPC ────────────────────────────────
  if (window.MixelParseApp && window.MixelParseApp.listMapFiles) {
    var result = await window.MixelParseApp.listMapFiles();
    if (result && !result.error) {
      var local = result.files.filter(function(f) {
        var fl = f.toLowerCase();
        return fl === lower+'.txt' || (fl.startsWith(lower+'_') && fl.endsWith('.txt'));
      }).sort();

      if (local.length) {
        _loadedZone  = shortname;
        _availLayers = local;
        renderLayerTabs();
        var base = local.find(function(f){ return f.toLowerCase() === lower+'.txt'; }) || local[0];
        await loadLayer(base);
        return;
      }
    }
  }

  // ── 4. Nothing found ─────────────────────────────────────────────────────────
  setNoMap('No map for "' + shortname + '"',
           'Zone not in bundled DB — rebuild map-db.js or add a local map file');
  _mapData = null; _transform = null; _loadedZone = shortname;
  scheduleDraw();
}

function setNoMap(msg, sub) {
  document.getElementById('noMapMsg').textContent = msg || '';
  document.getElementById('noMapSub').textContent = sub || '';
  noMap.style.display = '';
}

// ── HTML escaping (camp names are free text) ──────────────────────────────────
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// ── Follow mode ────────────────────────────────────────────────────────────────
function updateFollowBtn() {
  var btn = document.getElementById('followBtn');
  if (btn) btn.classList.toggle('on', _follow);
}

// ── Depth filter: only render geometry near the player's current Z ────────────
var _depthFilter = localStorage.getItem('mp_map_depth') === '1';
var DEPTH_RANGE  = 50;   // EQ Z-units above/below player considered "same floor"
function toggleDepth() {
  _depthFilter = !_depthFilter;
  try { localStorage.setItem('mp_map_depth', _depthFilter ? '1' : '0'); } catch(e) {}
  updateDepthBtn();
  scheduleDraw();
}
function updateDepthBtn() {
  var btn = document.getElementById('depthBtn');
  if (btn) btn.classList.toggle('on', _depthFilter);
}
updateDepthBtn();

// ── Auto timer attribution toggle ─────────────────────────────────────────────
// State is owned by index.html (_autoTimersEnabled); the button reflects the
// last pushed state and toggles optimistically.
var _autoTimers = true;
function toggleAutoTimers() {
  _autoTimers = !_autoTimers;
  updateAutoBtn();
  if (window.MixelParseApp && window.MixelParseApp.sendMapCommand) {
    window.MixelParseApp.sendMapCommand({ type: 'setAutoTimers', enabled: _autoTimers });
  }
}
function updateAutoBtn() {
  var btn = document.getElementById('autoBtn');
  if (btn) btn.classList.toggle('on', _autoTimers);
}
updateAutoBtn();

function startFollow() {
  _follow = true;
  _activeCampName = null;
  if (_playerLoc && _transform) {
    centerOnLoc(_playerLoc.x, _playerLoc.y, zoomForWorldRadius(FOLLOW_WORLD_RADIUS));
  }
  updateFollowBtn();
  renderCampBar();
}

function toggleFollow() {
  if (_follow) { _follow = false; updateFollowBtn(); return; }
  startFollow();
}

// ── Camp bar ──────────────────────────────────────────────────────────────────
function renderCampBar() {
  var bar     = document.getElementById('campBar');
  var chipsEl = document.getElementById('campChips');
  if (!bar || !chipsEl) return;
  bar.classList.toggle('empty', !_mapData);
  chipsEl.innerHTML = _campViews.map(function(c) {
    var active = c.camp_name === _activeCampName;
    var safe = escHtml(c.camp_name);
    return '<span class="camp-chip' + (active ? ' active' : '') + '" onclick="selectCampByName(' + JSON.stringify(c.camp_name) + ')">'
      + safe
      + '<span class="camp-chip-x" onclick="event.stopPropagation();deleteCampByName(' + JSON.stringify(c.camp_name) + ')" title="Delete camp">&times;</span>'
      + '</span>';
  }).join('');
}

function selectCampLocal(camp, sendToBackend) {
  _follow = false;
  _activeCampName = camp.camp_name;
  centerOn(camp.center_x, camp.center_y, camp.zoom);
  updateFollowBtn();
  renderCampBar();
  if (sendToBackend && window.MixelParseApp && window.MixelParseApp.sendMapCommand) {
    window.MixelParseApp.sendMapCommand({ type: 'selectCamp', name: camp.camp_name });
  }
}

function selectCampByName(name) {
  var camp = _campViews.find(function(c){ return c.camp_name === name; });
  if (camp) selectCampLocal(camp, true);
}

function deleteCampByName(name) {
  if (!confirm('Delete camp "' + name + '"?')) return;
  _campViews = _campViews.filter(function(c){ return c.camp_name !== name; });
  if (_activeCampName === name) _activeCampName = null;
  renderCampBar();
  if (window.MixelParseApp && window.MixelParseApp.sendMapCommand) {
    window.MixelParseApp.sendMapCommand({ type: 'deleteCamp', name: name });
  }
}

// Auto-select a view when a zone first finishes loading:
// nearest saved camp to player → most-recently-used camp → follow player → full zone fit
function pickInitialView() {
  _viewInitializedForZone = _loadedZone;
  var matched = null;
  if (_playerLoc && _campViews.length) {
    var bestDist = Infinity;
    for (var i = 0; i < _campViews.length; i++) {
      var c = _campViews[i];
      var d = Math.hypot(c.center_x - _playerLoc.x, c.center_y - _playerLoc.y);
      if (d < bestDist) { bestDist = d; matched = c; }
    }
    if (bestDist >= 1200) matched = null;  // too far — not "this" camp
  }
  if (!matched && _campViews.length) matched = _campViews[0];  // most recently used

  if (matched) {
    selectCampLocal(matched, false);
  } else if (_playerLoc) {
    startFollow();
  }
  // else: leave the full-zone fit view from applyMapContent()
}

// ── Save camp overlay ────────────────────────────────────────────────────────
function openSaveOverlay() {
  if (!_mapData) return;
  var el    = document.getElementById('saveOverlay');
  var input = document.getElementById('saveOverlayInput');
  if (!el || !input) return;
  input.value = _activeCampName || '';
  el.classList.add('show');
  setTimeout(function(){ input.focus(); input.select(); }, 30);
}

function closeSaveOverlay() {
  var el = document.getElementById('saveOverlay');
  if (el) el.classList.remove('show');
}

function confirmSaveCamp() {
  var input = document.getElementById('saveOverlayInput');
  var name  = input ? input.value.trim() : '';
  if (!name) { if (input) input.focus(); return; }
  var center = getViewCenterEQ();
  if (!center) { closeSaveOverlay(); return; }

  closeSaveOverlay();
  _follow = false;
  _activeCampName = name;
  updateFollowBtn();

  // Optimistic local update for instant feedback — real state push will reconcile
  var idx = _campViews.findIndex(function(c){ return c.camp_name === name; });
  var rec = { camp_name: name, center_x: center.x, center_y: center.y, zoom: _zoom };
  if (idx >= 0) _campViews[idx] = rec; else _campViews.unshift(rec);
  renderCampBar();

  if (window.MixelParseApp && window.MixelParseApp.sendMapCommand) {
    window.MixelParseApp.sendMapCommand({
      type: 'saveCamp', name: name, centerX: center.x, centerY: center.y, zoom: _zoom
    });
  }
}

document.getElementById('saveOverlayInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter')  confirmSaveCamp();
  if (e.key === 'Escape') closeSaveOverlay();
});

// ── Debug panel ───────────────────────────────────────────────────────────────
function _updateDebugPanel() {
  var panel = document.getElementById('debugPanel');
  var pre   = document.getElementById('debugPanelText');
  if (!panel || !pre || !_debugPing) return;

  var loc = _playerLoc;
  var lines = [];

  if (loc) {
    lines.push('/loc:  ' + loc.x.toFixed(2) + ', ' + loc.y.toFixed(2) + ', ' + loc.z.toFixed(2));
    lines.push('  locX (N/S) = ' + loc.x.toFixed(2) + '   locY (E/W) = ' + loc.y.toFixed(2));
    lines.push('');
    lines.push('Confirmed transform:  toCanvas(-locY, -locX)');
    lines.push('  → mapX = ' + (-loc.y).toFixed(2) + '   mapY = ' + (-loc.x).toFixed(2));
    lines.push('');
  } else {
    lines.push('/loc:  (none — type /loc in game)');
    lines.push('');
  }

  lines.push('Ping:  ex=' + _debugPing.ex.toFixed(2) + '  ey=' + _debugPing.ey.toFixed(2));

  if (loc) {
    var dx = (_debugPing.ex - (-loc.y)).toFixed(1);
    var dy = (_debugPing.ey - (-loc.x)).toFixed(1);
    lines.push('Δ:     ex' + (dx >= 0 ? '+' : '') + dx + '   ey' + (dy >= 0 ? '+' : '') + dy);
  }

  pre.textContent = lines.join('\n');
  panel.style.display = 'block';
}

// ── State handling ────────────────────────────────────────────────────────────
function onState(s) {
  _state = s;
  console.log('[MAP] state received — pins:', (s && s.spawnPins || []).length,
              'zone:', s && s.zoneShortname, 'loadedZone:', _loadedZone);

  // Update live dot
  var dot = document.getElementById('tbDot');
  if (dot) dot.classList.toggle('live', !!(s && s.active));

  // Sync Auto timer toggle from backend state
  if (s && typeof s.autoTimers === 'boolean' && s.autoTimers !== _autoTimers) {
    _autoTimers = s.autoTimers;
    updateAutoBtn();
  }

  // Sync camp views from backend (preserves active selection by name)
  _campViews = (s && s.campViews) || [];
  renderCampBar();

  var newZone = s && s.zoneShortname;
  var logName = s && s.zone;

  if (newZone && newZone !== _loadedZone) {
    // New valid zone — load map
    document.getElementById('tbZone').textContent = logName || newZone;
    loadZone(newZone);
  } else if (!newZone) {
    // No shortname — clear any stale map data
    if (_loadedZone) {
      _loadedZone = null; _mapData = null; _transform = null; _availLayers = [];
      _viewInitializedForZone = null; _campViews = [];
      renderLayerTabs(); renderCampBar();
      scheduleDraw();
    }
    if (logName) {
      // Have zone name but no shortname → unmapped zone
      document.getElementById('tbZone').textContent = logName;
      setNoMap('"' + logName + '" not in zone DB',
               'Use  /note timer MM:SS  in-game to register it');
    } else {
      // No zone at all
      document.getElementById('tbZone').textContent = 'No zone';
      // initial noMap HTML already says "Waiting for zone data"
    }
  } else if (newZone && _mapData && _viewInitializedForZone !== newZone) {
    // Map finished loading for the current zone and we haven't auto-positioned yet
    pickInitialView();
  }
  // Redraw whenever state arrives — pins, timers, or camp changes may have updated
  scheduleDraw();
}

function onLocUpdate(d) {
  // Heading: compute movement vector in map-file space from previous loc
  // Confirmed transform: mapX=-locY, mapY=-locX
  if (_playerLoc && (d.x !== _playerLoc.x || d.y !== _playerLoc.y)) {
    var dex = (-d.y) - (-_playerLoc.y);   // Δ mapX
    var dey = (-d.x) - (-_playerLoc.x);   // Δ mapY
    var dist = Math.sqrt(dex*dex + dey*dey);
    if (dist > 0.5) {
      var newH = Math.atan2(dey, dex);
      if (_playerHeading === null) {
        _playerHeading = newH;
      } else {
        // Exponential moving average with angle wraparound
        var diff = newH - _playerHeading;
        while (diff >  Math.PI) diff -= 2*Math.PI;
        while (diff < -Math.PI) diff += 2*Math.PI;
        _playerHeading = _playerHeading + 0.4 * diff;
      }
    }
  }
  _playerLoc = { x: d.x, y: d.y, z: d.z };
  // Update coords display in titlebar (include active transform mode for debugging)
  var el = document.getElementById('tbCoords');
  if (el && !_debugPing) {
    el.textContent = d.x.toFixed(0)+', '+d.y.toFixed(0)+', '+d.z.toFixed(0);
  }
  // Auto-recenter while following
  if (_follow && _transform) centerOnLoc(_playerLoc.x, _playerLoc.y);
  // Resolve a pending auto-view pick that was waiting on player location
  if (_mapData && _viewInitializedForZone !== _loadedZone) pickInitialView();
  scheduleDraw();
}

// ── 1s timer refresh (spawn countdown rings) ──────────────────────────────────
setInterval(function() {
  if (_state && (_state.spawnPins||[]).length) scheduleDraw();
}, 1000);

// ── IPC wiring ────────────────────────────────────────────────────────────────
if (window.MixelParseApp) {
  if (window.MixelParseApp.onMapState)     window.MixelParseApp.onMapState(onState);
  if (window.MixelParseApp.onMapLocUpdate) window.MixelParseApp.onMapLocUpdate(onLocUpdate);
}
</script>
