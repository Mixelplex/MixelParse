<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PL Helper — MixelParse</title>
<style>
/* Active kill tracker for power-levelling (owner, 2026-10-18: "I want an ACTIVE KILL tracker, for ones im trying to tag.
   In real time"). For the character being power-levelled: the mobs in the fight right now with TAG IT / HIT, then this
   pull's totals and each kill with XP or a missed tag. Read-only overlay. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#17161f;--card:#24232f;--line:#353445;--line2:#45435a;--text:#ece6da;--dim:#b9b2a5;--muted:#8a8597;--gold:#e0b552;--gold2:#f3d58a;--golddk:#8a6a24;--live:#55c47f;--danger:#ef6650;--fs:15}
html{font-size:calc(var(--fs) * 1px)}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,sans-serif;overflow:hidden;user-select:none}
.win{display:flex;flex-direction:column;height:100vh;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.tb{display:flex;align-items:center;gap:.4rem;padding:0 .4rem 0 .7rem;height:2.2rem;flex-shrink:0;-webkit-app-region:drag;background:linear-gradient(180deg,#2b2738 0%,#211f2c 100%);border-bottom:1px solid var(--golddk)}
.tb-title{font-weight:700;font-size:.82rem;letter-spacing:.06em;color:var(--gold2);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sp{flex:1}.nd{-webkit-app-region:no-drag}
.tb-btn{background:none;border:1px solid transparent;color:var(--dim);font-size:.8rem;font-weight:600;cursor:pointer;padding:.1rem .4rem;border-radius:6px}
.tb-btn:hover{background:var(--card);border-color:var(--line2);color:var(--text)}
.tb-x:hover{background:rgba(239,102,80,.2);border-color:rgba(239,102,80,.5);color:#fff}
.body{flex:1;overflow-y:auto;padding:.5rem .6rem .7rem}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1.6rem .8rem;line-height:1.6}
.h{font-size:.68rem;letter-spacing:.08em;color:var(--muted);margin:.55rem 0 .25rem}
.act{display:flex;align-items:center;gap:.5rem;padding:.38rem .55rem;border-radius:8px;margin-bottom:.3rem;border:1px solid var(--line2);background:var(--card)}
.act .an{flex:1;min-width:0;font-size:1.02rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .ag{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.act .st{font-weight:800;font-size:.9rem;letter-spacing:.04em;white-space:nowrap}
.act.tag{border-color:var(--danger);background:rgba(239,102,80,.14)}.act.tag .st{color:var(--danger)}
.act.ok{border-color:rgba(85,196,127,.5)}.act.ok .st{color:var(--live)}
.mobs{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.mob{font-size:.78rem;font-weight:700;border-radius:5px;padding:.08rem .4rem;border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.mob.y{color:var(--live);border-color:rgba(85,196,127,.5)}.mob.n{color:#fff;background:var(--danger);border-color:var(--danger)}
.actw{padding:.35rem .55rem;border-radius:8px;margin-bottom:.3rem;border:1px solid var(--line2);background:var(--card)}
.actw.tag{border-color:var(--danger);background:rgba(239,102,80,.12)}
.actw .top{display:flex;align-items:baseline;gap:.5rem}.actw .an{flex:1;min-width:0;font-size:1.02rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actw .cnt{font-weight:800;color:var(--gold2)}.actw .ag{font-size:.72rem;color:var(--muted);white-space:nowrap}
.tot{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.box{flex:1;min-width:5rem;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:.25rem .5rem;text-align:center}
.box b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.box span{font-size:.66rem;color:var(--muted);letter-spacing:.05em}
.box.miss b{color:var(--danger)}.box.xp b{color:var(--live)}
.k{display:flex;gap:.45rem;align-items:baseline;padding:.16rem .1rem;border-bottom:1px solid var(--line);font-size:.86rem}
.k .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k .tm{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.k.ok .s{color:var(--live)}.k.bad{background:rgba(239,102,80,.10)}.k.bad .s,.k.bad .m{color:var(--danger);font-weight:600}.k.wait .s{color:var(--muted)}
.sum{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:10px;margin-bottom:.45rem;border:2px solid var(--line2);background:var(--card)}
.sum .big{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum .msg{flex:1;text-align:right;font-weight:800;font-size:1rem}
.sum.good{border-color:var(--live)}.sum.good .msg{color:var(--live)}
.sum.need{border-color:var(--danger);background:rgba(239,102,80,.12)}.sum.need .msg{color:var(--danger)}
.sub{font-size:.74rem;color:var(--muted);margin:-.25rem 0 .2rem .2rem}
.note{color:var(--muted);font-size:.68rem;margin-top:.5rem;line-height:1.45}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <span class="tb-title" id="title">⚔ PL HELPER</span><span class="tb-sp"></span>
    <button class="tb-btn nd" title="Smaller text" onclick="zoom(-1)">A−</button>
    <button class="tb-btn nd" title="Bigger text" onclick="zoom(1)">A+</button>
    <button class="tb-btn nd" title="Minimize" onclick="window.MixelParseApp&&window.MixelParseApp.minimizePl()">–</button>
    <button class="tb-btn tb-x nd" title="Close (Settings → PL helper)" onclick="window.MixelParseApp&&window.MixelParseApp.closePl()">✕</button>
  </div>
  <div class="body" id="body"><div class="empty">Waiting for a kill that gives XP to one of your characters.</div></div>
</div>
<script>
let st=null;
let fs=15; try{ fs=+localStorage.getItem('mp_pl_fs')||15; }catch(e){}
function zoom(d){ fs=Math.max(11,Math.min(24,fs+d)); document.documentElement.style.setProperty('--fs',fs); try{ localStorage.setItem('mp_pl_fs',fs); }catch(e){} }
document.documentElement.style.setProperty('--fs',fs);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>String(s||'').replace(/^./,c=>c.toUpperCase());
function render(){
  const b=document.getElementById('body'), t=document.getElementById('title');
  if(!st){ t.textContent='⚔ PL HELPER'; b.innerHTML='<div class="empty">Waiting for a kill that gives XP to one of your characters.</div>'; return; }
  t.textContent='⚔ PL — '+st.char;
  const now=Date.now(), ago=s=>{ s=Math.max(0,Math.round((now-s)/1000)); return s<60?s+'s':Math.floor(s/60)+'m'; };
  // ACTIVE NOW: seen in the last 15 s and not killed since it was last seen; TAG IT until hit after that name's last kill
  const useSn=st.snared!=null, other=useSn?st.names.filter(n=>!n.snared&&now-n.last<=15e3):[];
  const act=st.names.filter(n=>(useSn?n.snared&&(n.alive>0):now-n.last<=15e3)&&!(n.lastKill&&n.lastKill>=n.last&&!useSn)).sort((a,b2)=>((b2.alive||0)-(b2.tagged||0))-((a.alive||0)-(a.tagged||0))||b2.last-a.last);
  const inRange=act.reduce((a,n)=>a+Math.max(n.alive||1,n.tagged||0),0), tagged=act.reduce((a,n)=>a+Math.min(n.tagged||0,Math.max(n.alive||1,n.tagged||0)),0), toGo=inRange-tagged;
  const hitsPull=st.names.reduce((a,n)=>a+(n.hits||0),0);
  const snared=st.snared!=null;
  const sumHtml=act.length?'<div class="sum '+(toGo?'need':'good')+'"><span class="big">'+(snared?'Snared: ':'')+inRange+(snared?'':' in range')+' · your hits: '+tagged+'</span><span class="msg">'+(toGo?toGo+' to go':'✓ you should be good')+'</span></div><div class="sub">'+(snared?'targets = mobs Figure snared (Bonds of Tunare / Ensnare), minus kills · ':'targets estimated from how often they attack · ')+hitsPull+' hit'+(hitsPull===1?'':'s')+' landed this pull</div>':'';
  b.innerHTML=sumHtml+'<div class="h">🎯 '+(useSn?'SNARED TARGETS':'ACTIVE NOW')+' — '+act.length+' name'+(act.length===1?'':'s')+'</div>'
    +(act.length?act.map(n=>{ const alive=Math.max(n.alive||1,n.tagged||0), tg=Math.min(n.tagged||0,alive), need=alive-tg;
        let chips=''; for(let i=1;i<=alive;i++) chips+='<span class="mob '+(i<=tg?'y':'n')+'">#'+i+' '+(i<=tg?'✓':'TAG IT')+'</span>';
        return '<div class="actw'+(need?' tag':'')+'"><div class="top"><span class="an">'+esc(cap(n.name))+' <span class="cnt">×'+alive+'</span></span><span class="ag">'+(need?need+' to tag':'all tagged')+' · seen '+ago(n.last)+' ago</span></div><div class="mobs">'+chips+'</div></div>'; }).join('')
      :'<div style="color:var(--muted);font-size:.82rem;padding:.2rem 0">Nothing fighting right now.</div>')
    +(other.length?'<div class="sub" style="margin-top:.2rem">Also fighting, not snared: '+other.map(n=>esc(cap(n.name))).join(', ')+'</div>':'')
    +'<div class="tot"><div class="box"><b>'+st.killed+'</b><span>KILLED</span></div><div class="box xp"><b>'+st.xp+'</b><span>XP FOR YOU</span></div><div class="box miss"><b>'+st.missed+'</b><span>MISSED TAG</span></div></div>'
    +'<div class="h">KILLS THIS PULL</div>'+(st.kills.length?st.kills.slice().reverse().map(k=>'<div class="k '+(k.xp===true?'ok':k.xp===false?'bad':'wait')+'"><span class="s">'+(k.xp===true?'✓':k.xp===false?'✗':'…')+'</span><span class="m"'+(k.unseen?' title="You got the XP, but the \u201chas been slain\u201d line wasn\u2019t in your log (it died out of range) \u2014 the name is a best guess"':'')+'>'+esc(cap(k.mob))+(k.xp===false?' — no XP (not tagged)':'')+(k.unseen?' <span style="color:var(--muted);font-size:.72rem">(kill not shown in your log)</span>':'')+'</span><span class="tm">'+ago(k.t)+' ago</span></div>').join(''):'<div style="color:var(--muted);font-size:.8rem">none yet</div>')
    +'<div class="note">×N = how many of that name are fighting (from how often they attack). Each hit you land tags the next one — tab to a new mob after every hit. A kill that gives you XP removes a tagged one; a kill with no XP was untagged (“Missed tag”).</div>';
}
if(window.MixelParseApp&&window.MixelParseApp.onPlState) window.MixelParseApp.onPlState(s=>{ st=s; render(); });
setInterval(render,1000);
</script>
</body>
</html>
