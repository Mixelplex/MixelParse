<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auctions — MixelParse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Live DKP auction board (owner, 2026-10-05; redesigned after the first live raid: bigger text, less per card,
   closed auctions folded away). Read-only: it never bids or posts. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --fs:18;
  --bg:#17161f;--bg2:#1d1c27;--card:#24232f;--card2:#2c2b39;--line:#353445;--line2:#45435a;
  --text:#ece6da;--dim:#b9b2a5;--muted:#8a8597;
  --gold:#e0b552;--gold2:#f3d58a;--golddk:#8a6a24;
  --live:#55c47f;--warn:#e8a33d;--danger:#ef6650;--blue:#7fa8e8;
}
html{font-size:calc(var(--fs) * 1px)}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none}
.win{display:flex;flex-direction:column;height:100vh;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--bg)}
/* title bar */
.tb{display:flex;align-items:center;gap:.5rem;padding:0 .5rem 0 .8rem;height:2.6rem;flex-shrink:0;-webkit-app-region:drag;
  background:linear-gradient(180deg,#2b2738 0%,#211f2c 100%);border-bottom:1px solid var(--golddk)}
.tb-title{font-family:'Cinzel',serif;font-weight:700;font-size:.95rem;letter-spacing:.08em;color:var(--gold2);display:flex;align-items:center;gap:.45rem;pointer-events:none}
.tb-count{font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:.12rem .5rem;border-radius:999px;background:rgba(85,196,127,.16);color:var(--live);border:1px solid rgba(85,196,127,.45)}
.tb-count.none{background:transparent;color:var(--muted);border-color:var(--line2)}
.tb-sp{flex:1}
.nd{-webkit-app-region:no-drag}
.tb-pop{font-size:.74rem;color:var(--dim);display:flex;align-items:center;gap:.3rem;cursor:pointer}
.tb-pop input{accent-color:var(--gold);width:.95rem;height:.95rem;cursor:pointer}
.tb-btn{background:none;border:1px solid transparent;color:var(--dim);font-size:.85rem;font-weight:600;cursor:pointer;padding:.15rem .45rem;line-height:1.2;border-radius:6px}
.tb-btn:hover{background:var(--card2);border-color:var(--line2);color:var(--text)}
.tb-x:hover{background:rgba(239,102,80,.2);border-color:rgba(239,102,80,.5);color:#fff}
/* body */
.body{flex:1;overflow-y:auto;padding:.6rem .6rem .8rem}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.empty{color:var(--muted);font-size:.95rem;text-align:center;padding:3rem 1.2rem;line-height:1.7}
.empty b{color:var(--gold)}
.empty .big{font-family:'Cinzel',serif;font-size:1.6rem;color:var(--golddk);display:block;margin-bottom:.4rem}
/* auction card */
.card{position:relative;background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%);border:1px solid var(--line);border-left:4px solid var(--live);border-radius:12px;margin-bottom:.7rem;overflow:hidden}
.card.late{border-left-color:var(--warn)}
.card.out{border-left-color:var(--danger);box-shadow:0 0 0 1px rgba(239,102,80,.35),0 0 18px rgba(239,102,80,.15)}
.card.lead{border-left-color:var(--live);box-shadow:0 0 0 1px rgba(85,196,127,.35),0 0 18px rgba(85,196,127,.12)}
.c-hdr{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem .2rem}
.c-item{font-family:'Cinzel',serif;font-weight:700;font-size:1.12rem;color:var(--gold2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;letter-spacing:.01em}
.c-item:hover{text-decoration:underline;text-underline-offset:3px}
.chip{flex-shrink:0;font-size:.78rem;font-weight:600;padding:.18rem .55rem;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.open{background:rgba(85,196,127,.14);color:var(--live)}
.chip.soon{background:rgba(232,163,61,.18);color:var(--warn)}
.chip.late{background:rgba(232,163,61,.12);color:var(--warn)}
.chip.done{background:var(--card2);color:var(--muted)}
.chip.sold{background:rgba(224,181,82,.18);color:var(--gold2)}
.card.sold{border-left-color:var(--gold)}
.card.won{border-left-color:var(--gold);box-shadow:0 0 0 1px rgba(224,181,82,.5),0 0 22px rgba(224,181,82,.2)}
.grats{font-size:1.05rem;color:var(--gold2);padding:.55rem .8rem .75rem}
.grats b{color:#fff}
.c-price{display:flex;flex-wrap:wrap;gap:.35rem;padding:.25rem .8rem .55rem}
.pp{font-size:.78rem;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:.1rem .45rem;white-space:nowrap}
.pp b{color:var(--text);font-weight:600}
.pp.key{border-color:var(--golddk);color:var(--gold2)}
.pp.key b{color:var(--gold2)}
.banner{font-size:.88rem;font-weight:700;padding:.4rem .8rem;background:rgba(239,102,80,.16);color:#ff8f7d;border-top:1px solid rgba(239,102,80,.3)}
.banner.lead{background:rgba(85,196,127,.13);color:#7fe0a3;border-top-color:rgba(85,196,127,.3)}
/* top bid hero */
.hero{display:flex;align-items:center;gap:.8rem;padding:.6rem .8rem;background:rgba(0,0,0,.18);border-top:1px solid var(--line)}
.hero-n{min-width:3.4rem;text-align:center;font-size:1.9rem;font-weight:700;line-height:1;color:var(--gold2);padding:.35rem .5rem;border-radius:10px;background:rgba(224,181,82,.1);border:1px solid var(--golddk);font-variant-numeric:tabular-nums}
.hero-n small{display:block;font-size:.58rem;font-weight:700;letter-spacing:.12em;color:var(--gold);margin-top:.25rem}
.hero-who{flex:1;min-width:0}
.hero-name{font-size:1.08rem;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-name .for{font-weight:500;color:var(--blue);font-size:.92rem}
.hero-bal{font-size:.86rem;color:var(--dim);margin-top:.15rem}
.nobids{padding:.55rem .8rem .7rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;font-style:italic}
/* bid rows */
.bids{padding:.35rem .5rem .5rem}
.bid{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:.55rem;padding:.32rem .35rem;border-radius:8px;font-size:.92rem}
.bid:nth-child(odd){background:rgba(255,255,255,.025)}
.bid.mine{background:rgba(224,181,82,.12);outline:1px solid rgba(224,181,82,.35)}
.bid-n{font-weight:700;text-align:center;color:var(--text);background:var(--card2);border-radius:6px;padding:.08rem 0;font-variant-numeric:tabular-nums}
.bid-who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500}
.bid-who .for{color:var(--blue);font-weight:400;font-size:.85rem}
.bal{font-size:.82rem;color:var(--dim);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.bal .ra{color:var(--muted)}
.bal.over{color:var(--danger);font-weight:700}
.bal.none{color:var(--muted)}
.more{font-size:.8rem;font-weight:600;color:var(--gold);text-align:center;padding:.3rem;cursor:pointer;border-radius:6px}
.more:hover{background:rgba(224,181,82,.08)}
/* closed list */
.closed-h{display:flex;align-items:center;gap:.5rem;font-family:'Cinzel',serif;font-weight:700;font-size:.82rem;letter-spacing:.1em;color:var(--muted);padding:.5rem .3rem .4rem;cursor:pointer}
.closed-h:hover{color:var(--dim)}
.closed-h .ln{flex:1;height:1px;background:var(--line)}
.cl{display:flex;align-items:baseline;gap:.6rem;padding:.4rem .6rem;border-radius:8px;font-size:.88rem;color:var(--dim)}
.cl:nth-child(even){background:rgba(255,255,255,.025)}
.cl-item{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);cursor:pointer}
.cl-item:hover{text-decoration:underline}
.cl-win{white-space:nowrap}
.cl-win b{color:var(--gold2)}
.cl-none{color:var(--muted);font-style:italic;white-space:nowrap}
/* tiles: 3 per column, then a new column to the right (the window widens to fit) */
.tiles{column-count:var(--cols,1);column-gap:.7rem}
.tiles .card{break-inside:avoid;-webkit-column-break-inside:avoid;display:block}
.card.ign{opacity:.45}
.menu{position:fixed;z-index:50;min-width:13rem;background:var(--card2);border:1px solid var(--golddk);border-radius:10px;padding:.3rem;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.menu div{padding:.45rem .7rem;border-radius:7px;font-size:.88rem;cursor:pointer;color:var(--text)}
.menu div:hover{background:rgba(224,181,82,.14)}
.menu .mh{font-size:.68rem;letter-spacing:.08em;color:var(--muted);cursor:default;padding:.2rem .7rem .3rem}
.menu .mh:hover{background:none}
.foot a{color:var(--gold);cursor:pointer;text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot{font-size:.72rem;color:var(--muted);padding:.4rem .8rem;background:var(--bg2);border-top:1px solid var(--line);flex-shrink:0;display:flex;justify-content:space-between;gap:.5rem}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <span class="tb-title">⚖ Auctions <span class="tb-count none" id="count">none open</span></span>
    <span class="tb-sp"></span>
    <label class="tb-pop nd" title="Open this window by itself when an officer starts an auction in /auction"><input type="checkbox" id="pop" onchange="cmd({type:'autoPop',on:this.checked})"> pop up</label>
    <button class="tb-btn nd" onclick="zoom(-1)" title="Smaller text">A−</button>
    <button class="tb-btn nd" onclick="zoom(1)" title="Bigger text">A+</button>
    <button class="tb-btn nd" onclick="window.MixelParseApp&&window.MixelParseApp.minimizeAuction&&window.MixelParseApp.minimizeAuction()" title="Minimize">&#8211;</button>
    <button class="tb-btn tb-x nd" onclick="window.MixelParseApp&&window.MixelParseApp.closeAuction&&window.MixelParseApp.closeAuction()" title="Close">&#215;</button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot"><span>Reads /auction only — it never bids for you. <span id="ign"></span></span><span id="sync"></span></div>
</div>
<div class="menu" id="menu"></div>
<script>
let S = { auctions: [], autoPop: true };
const expanded = new Set();
const SHOW = 1;   // top bid + the runner-up (owner: the rest don't matter); your own bid always shows
// per-viewer conveniences: text size and whether the closed list is open
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
let fs = Math.min(28, Math.max(13, +lsGet('auc_fs2', 18) || 18));
let showClosed = lsGet('auc_closed', '0') === '1';
document.documentElement.style.setProperty('--fs', fs);
function zoom(d){ fs = Math.min(28, Math.max(13, fs + d)); document.documentElement.style.setProperty('--fs', fs); lsSet('auc_fs2', fs); }
function toggleClosed(){ showClosed = !showClosed; lsSet('auc_closed', showClosed ? '1' : '0'); render(); }
function toggle(id){ expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
// right-click → Ignore: hidden here, and the main window stops outbid / grats notices for it (kept on this PC)
let ignored = new Set((() => { try { return JSON.parse(lsGet('auc_ignored', '[]')); } catch (e) { return []; } })());
let showIgnored = false;
function setIgnored(id, on){ on ? ignored.add(id) : ignored.delete(id); lsSet('auc_ignored', JSON.stringify([...ignored].slice(-200))); cmd({ type: 'ignore', id, on }); hideMenu(); render(); }
function toggleShowIgnored(){ showIgnored = !showIgnored; render(); }
function hideMenu(){ document.getElementById('menu').style.display = 'none'; }
function cardMenu(ev, id){
  ev.preventDefault();
  const a = (S.auctions || []).find(x => x.id === id); if (!a) return false;
  const m = document.getElementById('menu'), ig = ignored.has(id);
  m.innerHTML = '<div class="mh">' + esc(a.item.toUpperCase()) + '</div>'
    + '<div onclick="setIgnored(\'' + id + '\',' + (!ig) + ')">' + (ig ? '↶ Un-ignore' : '✕ Ignore this auction') + '</div>';
  m.style.display = 'block';
  m.style.left = Math.min(ev.clientX, innerWidth - m.offsetWidth - 6) + 'px';
  m.style.top = Math.min(ev.clientY, innerHeight - m.offsetHeight - 6) + 'px';
  return false;
}
document.addEventListener('mousedown', e => { if (!e.target.closest('#menu')) hideMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideMenu(); });
// columns: 3 tiles per column, up to 4 columns; the one-column width is whatever the user last sized it to
const PER_COL = 3, MAX_COLS = 4;
let cols = 0, ourResize = 0;
let colW = +lsGet('auc_colw', 0) || 0;
window.addEventListener('resize', () => {
  if (performance.now() < ourResize) return;             // our own widening — not a user choice (real time, not the auction clock)
  if (cols >= 1) { colW = Math.round(innerWidth / cols); lsSet('auc_colw', colW); }
});
function fitColumns(n){
  const want = Math.max(1, Math.min(MAX_COLS, Math.ceil(n / PER_COL)));
  document.documentElement.style.setProperty('--cols', want);
  if (want === cols) return;
  if (!colW) colW = Math.round(innerWidth / Math.max(1, cols || 1));
  cols = want; ourResize = performance.now() + 800;
  if (window.MixelParseApp && window.MixelParseApp.resizeAuctionWidth) window.MixelParseApp.resizeAuctionWidth(colW * want);
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cmd(c){ if (window.MixelParseApp && window.MixelParseApp.sendAuctionCommand) window.MixelParseApp.sendAuctionCommand(c); }
function mmss(ms){ ms = Math.max(0, Math.round(ms / 1000)); return Math.floor(ms / 60) + ':' + String(ms % 60).padStart(2, '0'); }
function ago(ms){ const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm'; }
function num(n){ return Math.round(n).toLocaleString(); }
// encodeURIComponent leaves ' alone, which broke the click on "Trakanon's Tooth" — escape it too
function wiki(item){ return 'cmd({type:\'wiki\',item:decodeURIComponent(\'' + encodeURIComponent(item).replace(/'/g, '%27') + '\')})'; }
function forToon(b){ return b.toon && b.toon.toLowerCase() !== String(b.who).toLowerCase() ? ' <span class="for">→ ' + esc(b.toon) + '</span>' : ''; }
function bal(b){
  if (b.bal == null) return '<span class="bal none" title="Not on Castle\'s ODKP">no ODKP</span>';
  const tip = (b.acct ? b.acct + '\'s account · ' : '') + b.bal + ' DKP now' + (b.over ? ' — bid is more than they have' : '');
  return '<span class="bal' + (b.over ? ' over' : '') + '" title="' + esc(tip) + '">' + (b.over ? '⚠ ' : '') + num(b.bal) + ' DKP</span>';
}
// one row per bidder + toon: their highest bid (re-bids and corrections collapse)
function bidRows(a){
  const m = new Map();
  for (const b of a.bids || []) {
    const k = String(b.who).toLowerCase() + '|' + String(b.toon || '').toLowerCase();
    const o = m.get(k);
    if (!o || b.n > o.n || (b.n === o.n && b.ts > o.ts)) m.set(k, Object.assign({}, b, { mine: b.mine || (o && o.mine) }));
  }
  return [...m.values()].sort((x, y) => y.n - x.n || x.ts - y.ts);
}
function priceChips(p){
  if (!p) return '<span class="pp">never sold on ODKP</span>';
  return (p.r60 != null ? '<span class="pp key" title="Average of the last 60 days (' + p.r60n + ' sold)">usually <b>' + p.r60 + '</b></span>' : '<span class="pp" title="No sales in the last 60 days">no recent sales</span>')
    + '<span class="pp">high <b>' + p.high + '</b></span><span class="pp">avg <b>' + p.avg + '</b></span><span class="pp">' + p.count + ' sold</span>';
}
// "Fled · 1 DKP", several winners for several copies, "rotted" for ROT
function winText(ws, html){
  return ws.map(w => /^rot$/i.test(w.who) ? 'rotted' : (html ? '<b>' + esc(w.who) + '</b>' : esc(w.who)) + (w.n != null ? ' · ' + w.n + ' DKP' : '')).join(html ? ' &nbsp;&amp;&nbsp; ' : ' & ');
}
function card(a, now){
  const sold = !!(a.winners && a.winners.length), late = now >= a.closeAt;
  const st = sold ? '<span class="chip sold">sold</span>'
    // how long it's been running — a reference only; it stays open until the officer's grats (amber past the posted 2m30s)
    : '<span class="chip ' + (late ? 'late' : 'open') + '" title="How long it\'s been open — it closes when the officer grats it">⏱ <span class="tm" data-o="' + a.open + '"></span></span>';
  const rows = bidRows(a), top = a.top, iWon = sold && a.winners.some(w => w.mine);
  const cls = sold ? (iWon ? ' won' : ' sold') : a.outbid ? ' out' : a.leading ? ' lead' : late ? ' late' : '';
  const ctx = ' oncontextmenu="return cardMenu(event,\'' + a.id + '\')"' + (ignored.has(a.id) ? ' title="Ignored — right-click to un-ignore"' : '');
  const ign = ignored.has(a.id) ? ' ign' : '';
  if (sold) return '<div class="card' + cls + ign + '"' + ctx + '>'
    + '<div class="c-hdr"><span class="c-item" onclick="' + wiki(a.item) + '" title="Open on the P99 wiki">' + esc(a.item) + '</span>' + st + '</div>'
    + '<div class="grats">' + (iWon ? '🎉 Grats — you won! ' : '✓ Grats ') + winText(a.winners, true) + '</div></div>';
  const rest = top ? rows.filter(b => !(b.n === top.n && String(b.who).toLowerCase() === String(top.who).toLowerCase() && String(b.toon || '').toLowerCase() === String(top.toon || '').toLowerCase())) : rows;
  let shown = expanded.has(a.id) ? rest : rest.slice(0, SHOW);
  if (!expanded.has(a.id)) { const me = rest.find(b => b.mine); if (me && !shown.includes(me)) shown = shown.concat(me); }
  const hidden = rest.length - shown.length;
  return '<div class="card' + cls + ign + '"' + ctx + '>'
    + '<div class="c-hdr"><span class="c-item" onclick="' + wiki(a.item) + '" title="Open on the P99 wiki' + (a.by ? ' · opened by ' + esc(a.by) : '') + '">' + esc(a.item) + '</span>' + st + '</div>'
    + '<div class="c-price">' + priceChips(a.stats) + '</div>'
    + (a.outbid ? '<div class="banner">⚠ You\'ve been outbid — ' + top.n + ' by ' + esc(top.toon || top.who) + '</div>' : a.leading ? '<div class="banner lead">✓ You\'re the high bid</div>' : '')
    + (top ? '<div class="hero"><div class="hero-n">' + top.n + '<small>TOP BID</small></div><div class="hero-who"><div class="hero-name">' + esc(top.who) + forToon(top) + '</div><div class="hero-bal">' + bal(top) + '</div></div></div>'
           : '<div class="nobids">No bids yet</div>')
    + (rest.length ? '<div class="bids">' + shown.map(b => '<div class="bid' + (b.mine ? ' mine' : '') + '" title="' + esc(new Date(b.ts).toLocaleTimeString()) + '"><span class="bid-n">' + b.n + '</span><span class="bid-who">' + esc(b.who) + forToon(b) + '</span>' + bal(b) + '</div>').join('')
        + (hidden > 0 || (expanded.has(a.id) && rest.length > SHOW) ? '<div class="more" onclick="toggle(\'' + a.id + '\')">' + (expanded.has(a.id) ? 'show fewer' : '+ ' + hidden + ' more bidder' + (hidden === 1 ? '' : 's')) + '</div>' : '') + '</div>' : '')
    + '</div>';
}
function closedRow(a){
  const t = a.top, ws = a.winners || [];
  return '<div class="cl"><span class="cl-item" onclick="' + wiki(a.item) + '" title="Open on the P99 wiki">' + esc(a.item) + '</span>'
    + (ws.length ? '<span class="cl-win" title="From the officer\'s grats">✓ ' + winText(ws, true) + '</span>'
      : '<span class="cl-none" title="No grats seen for 30 minutes' + (t ? ' — top bid was ' + t.n + ' by ' + esc(t.toon || t.who) : '') + '">no grats seen</span>') + '</div>';
}
function render(){
  const now = Date.now(), list = S.auctions || [];
  // a grats stays up as a "sold" card for a minute, then folds into Closed
  const justSold = a => a.gratsAt && now - a.gratsAt < 60e3;
  const live = list.filter(a => (!a.closed && now < a.idleAt) || justSold(a)), done = list.filter(a => !live.includes(a));
  const nIgn = live.filter(a => ignored.has(a.id)).length;
  const open = showIgnored ? live : live.filter(a => !ignored.has(a.id));
  document.getElementById('ign').innerHTML = nIgn ? '· <a onclick="toggleShowIgnored()">' + nIgn + ' ignored · ' + (showIgnored ? 'hide' : 'show') + '</a>' : '';
  const c = document.getElementById('count');
  const nOpen = open.filter(a => !justSold(a)).length;
  c.textContent = nOpen ? nOpen + ' open' : 'none open'; c.classList.toggle('none', !nOpen);
  document.getElementById('pop').checked = !!S.autoPop;
  document.getElementById('sync').textContent = S.dkpAsOf ? 'DKP as of ' + new Date(S.dkpAsOf).toLocaleString([], {month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
  const body = document.getElementById('body'), y = body.scrollTop;
  // auctions you're in first (outbid, then leading), then newest opened — order doesn't jump as bids arrive
  const order = open.slice().sort((x, y) => (y.outbid ? 2 : y.leading ? 1 : 0) - (x.outbid ? 2 : x.leading ? 1 : 0) || (y.open || 0) - (x.open || 0));
  const html = !list.length ? '<div class="empty"><span class="big">⚖</span>No auctions right now.<br>This window opens when an officer starts one in <b>/auction</b>.</div>'
    : (order.length ? '<div class="tiles">' + order.map(a => card(a, now)).join('') + '</div>' : '<div class="empty" style="padding:1.6rem 1rem">Nothing open right now.</div>')
    + (done.length ? '<div class="closed-h" onclick="toggleClosed()"><span>' + (showClosed ? '▾' : '▸') + ' CLOSED · ' + done.length + '</span><span class="ln"></span></div>'
      + (showClosed ? done.slice().sort((x, y) => (y.last || 0) - (x.last || 0)).map(closedRow).join('') : '') : '');
  // rebuild only when something changed — a rebuild every second ate clicks (item → wiki, "+ more", Closed)
  fitColumns(order.length);
  if (html !== lastHtml) { body.innerHTML = html; lastHtml = html; body.scrollTop = y; }
  for (const el of body.querySelectorAll('.tm')) el.textContent = mmss(now - +el.dataset.o);
}
let lastHtml = '';
if (window.MixelParseApp && window.MixelParseApp.onAuctionState) window.MixelParseApp.onAuctionState(st => { S = st || S; render(); });
setInterval(render, 1000);
render();
</script>
