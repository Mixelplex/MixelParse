name: Build and Release MixelParse.exe

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    # Creating the GitHub release needs write access — the default GITHUB_TOKEN is
    # read-only. (Earlier releases were created locally with a personal token, so
    # CI only ever uploaded into an existing release and never needed this.)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:ci

      # electron-builder only embeds release-notes.md in latest.yml (auto-updater);
      # this puts the same notes on the GitHub release page.
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --notes-file release-notes.md
