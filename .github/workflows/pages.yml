name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/index.html'
      - 'src/admin.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy src files to docs/
        run: |
          mkdir -p docs
          cp src/index.html docs/index.html
          cp src/admin.html docs/admin.html

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: deploy src to docs [skip ci]"
          git push
